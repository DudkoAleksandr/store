<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button class="btn__filter">Фильтр</button>
    <a href="./basket.html"><button class="btn__filter">Корзина</button></a>
    <div class="filter filter__none">
      <form class="filter__form" action="">
        <input class="input__search" type="text" placeholder="Поиск..." />
        <select class="select__sort" name="" id="">
          <option value="default" selected>По умолчанию</option>
          <option value="price-up">По цене ↑</option>
          <option value="price-down">По цене ↓</option>
          <option value="rating">По рейтингу</option>
        </select>
        <div class="checkbox__search-brand checkbox__style">
          <label for="lenovo">
            <input id="lenovo" type="checkbox" value="Lenovo" />Lenovo</label
          >

          <label for="samsung">
            <input id="samsung" type="checkbox" value="Samsung" />Samsung</label
          >

          <label for="jbl">
            <input id="jbl" type="checkbox" value="JBL" />JBL</label
          >

          <label for="lg">
            <input id="lg" type="checkbox" value="LG" />LG</label
          >

          <label for="logitech">
            <input
              id="logitech"
              type="checkbox"
              value="Logitech"
            />Logitech</label
          >

          <label for="apple">
            <input id="apple" type="checkbox" value="Apple" />Apple</label
          >

          <label for="xiaomi">
            <input id="xiaomi" type="checkbox" value="Xiaomi" />Xiaomi</label
          >
        </div>

        <div class="checkbox__color checkbox__style">
          <label for="black">
            <input id="black" type="checkbox" value="Черный" />Черный</label
          >
          <label for="blue">
            <input id="blue" type="checkbox" value="Синий" />Синий</label
          >
          <label for="white">
            <input id="white" type="checkbox" value="Белый" />Белый</label
          >
          <label for="gray">
            <input id="gray" type="checkbox" value="Серый" />Серый</label
          >
          <label for="red">
            <input id="red" type="checkbox" value="Красный" />Красный</label
          >
        </div>

        <div class="checkbox">
          <input id="check" type="checkbox" /><label
            class="checkbox__text"
            for="check"
            >Показать товары со скидкой</label
          >
        </div>
        <div class="input__range">
          <span class="range__min"></span>
          <div class="range__card">
            <div>
              <input class="range__price" type="range" />
            </div>
            <span class="range__resualt"></span>
          </div>
          <span class="range__max"></span>
        </div>
      </form>
    </div>
    <div class="cards"></div>
    <script type="module" src="./scriptNew.js"></script>
  </body>
</html>
